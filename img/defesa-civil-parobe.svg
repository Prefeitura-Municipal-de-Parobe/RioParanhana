<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">Defesa Civil de Parobé</title>
  <desc id="desc">Símbolo visual em azul, branco e laranja para o monitoramento do Rio Paranhana.</desc>

  <circle cx="100" cy="100" r="94" fill="#ffffff"/>
  <circle cx="100" cy="100" r="88" fill="#0b5cb7"/>
  <circle cx="100" cy="100" r="74" fill="#ffffff"/>

  <!-- aro laranja -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="#f28c28" stroke-width="8"/>

  <!-- triângulo de proteção/civil -->
  <path d="M100 49 L146 127 H54 Z"
        fill="#0b5cb7"
        stroke="#0a4f9e"
        stroke-width="4"
        stroke-linejoin="round"/>

  <!-- escudo central -->
  <path d="M100 71 L121 79 V98
           C121 113 113 124 100 133
           C87 124 79 113 79 98
           V79 Z"
        fill="#ffffff"
        stroke="#ffffff"
        stroke-width="2"/>

  <!-- check -->
  <path d="M89 99 L97 107 L112 90"
        fill="none"
        stroke="#0b5cb7"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- detalhes laterais -->
  <circle cx="44" cy="100" r="4" fill="#f28c28"/>
  <circle cx="156" cy="100" r="4" fill="#f28c28"/>
</svg>
